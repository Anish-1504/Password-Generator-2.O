<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POW! Password Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --comic-yellow:#ffe066;
    --comic-red:#ff3b3b;
    --comic-blue:#3b7dff;
    --comic-black:#111111;
    --comic-white:#fffdf5;
    --comic-purple:#a259ff;
    --comic-green:#3ddc84;

    --bg-grad-1:var(--comic-blue);
    --bg-grad-2:var(--comic-purple);
    --panel-bg:var(--comic-white);
    --panel-border:var(--comic-black);
    --panel-shadow:var(--comic-black);
    --text-main:var(--comic-black);
    --control-bg:#ffffff;
    --dots-color: rgba(0,0,0,0.08);
  }

  body[data-theme="dark"]{
    --bg-grad-1:#1a1a2e;
    --bg-grad-2:#16213e;
    --panel-bg:#232336;
    --panel-border:#f5f5f5;
    --panel-shadow:#000000;
    --text-main:#f5f5f5;
    --control-bg:#2e2e46;
    --dots-color: rgba(255,255,255,0.06);
    --comic-white:#2e2e46;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Comic Neue', cursive, sans-serif;
    background:
      radial-gradient(circle, var(--dots-color) 1.5px, transparent 1.5px) 0 0/22px 22px,
      linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 16px;
    transition:background .3s ease;
  }

  .comic-panel{
    background:var(--panel-bg);
    border:6px solid var(--panel-border);
    border-radius:14px;
    box-shadow: 10px 10px 0 var(--panel-shadow);
    max-width:520px;
    width:100%;
    padding:28px 26px 32px;
    position:relative;
    overflow:hidden;
    transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }

  .comic-panel::before{
    content:"";
    position:absolute;
    top:-40px; right:-40px;
    width:140px; height:140px;
    background:radial-gradient(circle, var(--dots-color) 2px, transparent 2px);
    background-size:14px 14px;
    transform:rotate(15deg);
    pointer-events:none;
  }

  .top-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:-8px;
  }

  .theme-switch{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Bangers', cursive;
    font-size:0.85rem;
    color:var(--text-main);
    letter-spacing:1px;
  }

  .toggle{
    position:relative;
    width:56px;
    height:28px;
    background:var(--comic-yellow);
    border:3px solid var(--panel-border);
    border-radius:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  .toggle-knob{
    position:absolute;
    top:1px;
    left:1px;
    width:20px;
    height:20px;
    background:var(--comic-black);
    border:2px solid var(--panel-border);
    border-radius:50%;
    transition:transform .2s ease, background .2s ease;
  }
  body[data-theme="dark"] .toggle-knob{
    transform:translateX(27px);
    background:var(--comic-purple);
  }
  body[data-theme="dark"] .toggle{
    background:#444466;
  }

  h1{
    font-family:'Bangers', cursive;
    font-size:2.6rem;
    letter-spacing:2px;
    text-align:center;
    color:var(--comic-red);
    -webkit-text-stroke:2px var(--panel-border);
    margin:8px 0 4px;
    transform:rotate(-2deg);
  }

  .subtitle{
    text-align:center;
    font-weight:700;
    margin:0 0 22px;
    color:#111;
    background:var(--comic-yellow);
    display:inline-block;
    padding:4px 14px;
    border:3px solid var(--panel-border);
    border-radius:8px;
    transform:rotate(1deg);
  }
  .subtitle-wrap{text-align:center; margin-bottom:20px;}

  .burst{
    position:absolute;
    top:14px; left:14px;
    font-family:'Bangers', cursive;
    font-size:0.85rem;
    color:#111;
    background:var(--comic-green);
    border:3px solid var(--panel-border);
    padding:4px 10px;
    border-radius:50%;
    transform:rotate(-12deg);
  }

  .output-bubble{
    position:relative;
    background:var(--control-bg);
    border:4px solid var(--panel-border);
    border-radius:14px;
    padding:18px 16px;
    margin-bottom:22px;
    box-shadow:5px 5px 0 var(--panel-shadow);
    transition:background .3s ease;
  }
  .output-bubble::after{
    content:"";
    position:absolute;
    bottom:-18px; left:40px;
    width:0; height:0;
    border:14px solid transparent;
    border-top-color:var(--panel-border);
  }
  .output-bubble::before{
    content:"";
    position:absolute;
    bottom:-13px; left:44px;
    width:0; height:0;
    border:11px solid transparent;
    border-top-color:var(--control-bg);
    z-index:1;
  }

  #password{
    width:100%;
    font-family:'Comic Neue', monospace, cursive;
    font-weight:700;
    font-size:1.25rem;
    letter-spacing:1px;
    border:none;
    background:transparent;
    color:var(--text-main);
    word-break:break-all;
    text-align:center;
  }
  #password:focus{outline:none;}

  .copy-row{
    display:flex;
    justify-content:center;
    margin-top:10px;
  }

  .btn{
    font-family:'Bangers', cursive;
    letter-spacing:1px;
    font-size:1rem;
    border:3px solid var(--panel-border);
    border-radius:8px;
    padding:8px 18px;
    cursor:pointer;
    background:var(--comic-yellow);
    color:#111;
    box-shadow:4px 4px 0 var(--panel-shadow);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{
    transform:translate(4px,4px);
    box-shadow:0 0 0 var(--panel-shadow);
  }
  .btn:hover{filter:brightness(1.05);}

  .btn-copy{background:var(--comic-green); color:#111;}

  .controls{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:22px;
  }

  .control-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--control-bg);
    border:3px solid var(--panel-border);
    border-radius:10px;
    padding:10px 14px;
    transition:background .3s ease;
  }

  .control-row label{
    font-weight:700;
    color:var(--text-main);
  }

  .length-value{
    font-family:'Bangers', cursive;
    background:var(--comic-red);
    color:#fff;
    padding:2px 10px;
    border-radius:6px;
    border:2px solid var(--panel-border);
    min-width:34px;
    text-align:center;
  }

  .slider-track{
    position:relative;
    flex:1;
    margin:0 14px;
    height:10px;
    border-radius:6px;
    background:#d9d9d9;
    cursor:pointer;
    touch-action:none;
  }
  .slider-fill{
    position:absolute;
    top:0; left:0;
    height:100%;
    width:25%;
    border-radius:6px;
    background:var(--comic-red);
    pointer-events:none;
  }
  .slider-thumb{
    position:absolute;
    top:50%;
    left:25%;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--comic-yellow);
    border:3px solid var(--panel-border);
    transform:translate(-50%, -50%);
    cursor:grab;
    box-shadow:2px 2px 0 var(--panel-shadow);
  }
  .slider-thumb:active{
    cursor:grabbing;
  }

  .checkbox-row{
    justify-content:flex-start;
    gap:12px;
  }

  input[type="checkbox"]{
    width:22px;
    height:22px;
    accent-color:var(--comic-blue);
    cursor:pointer;
  }

  .generate-btn{
    width:100%;
    font-size:1.4rem;
    padding:14px;
    background:var(--comic-red);
    color:#fff;
    box-shadow:6px 6px 0 var(--panel-shadow);
  }

  .strength{
    margin-top:16px;
    text-align:center;
    font-weight:700;
    color:var(--text-main);
  }
  .strength span{
    font-family:'Bangers', cursive;
    padding:3px 14px;
    border:3px solid var(--panel-border);
    border-radius:6px;
    display:inline-block;
    margin-left:6px;
    color:#111;
    text-shadow:none;
    box-shadow:3px 3px 0 var(--panel-shadow);
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) scale(0.8);
    background:var(--comic-yellow);
    border:3px solid var(--panel-border);
    border-radius:8px;
    padding:8px 18px;
    font-family:'Bangers', cursive;
    letter-spacing:1px;
    color:#111;
    box-shadow:4px 4px 0 var(--panel-shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }

  @media (max-width:420px){
    h1{font-size:2rem;}
  }
</style>
</head>
<body data-theme="light">

  <div class="comic-panel">
    <div class="burst">ZAP!</div>

    <div class="top-row">
      <div class="theme-switch">
        <span id="themeLabel">LIGHT</span>
        <div class="toggle" id="themeToggle">
          <div class="toggle-knob"></div>
        </div>
      </div>
    </div>

    <h1>PASSWORD POW!</h1>
    <div class="subtitle-wrap">
      <div class="subtitle">Secure your secret identity</div>
    </div>

    <div class="output-bubble">
      <input type="text" id="password" readonly value="Click GENERATE!">
      <div class="copy-row">
        <button class="btn btn-copy" id="copyBtn">COPY!</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-row">
        <label for="lengthSliderThumb">LENGTH</label>
        <div class="slider-track" id="lengthSliderTrack">
          <div class="slider-fill" id="lengthSliderFill"></div>
          <div class="slider-thumb" id="lengthSliderThumb" tabindex="0" role="slider"
               aria-valuemin="4" aria-valuemax="32" aria-valuenow="12"></div>
        </div>
        <span class="length-value" id="lengthValue">12</span>
      </div>

      <div class="control-row checkbox-row">
        <input type="checkbox" id="numbersCheck" checked>
        <label for="numbersCheck">Include Numbers (0-9)</label>
      </div>

      <div class="control-row checkbox-row">
        <input type="checkbox" id="specialCheck" checked>
        <label for="specialCheck">Include Special Characters (!@#$)</label>
      </div>

      <div class="control-row checkbox-row">
        <input type="checkbox" id="upperCheck" checked>
        <label for="upperCheck">Include Uppercase (A-Z)</label>
      </div>
    </div>

    <button class="btn generate-btn" id="generateBtn">GENERATE!</button>

    <div class="strength">
      Strength:<span id="strengthLabel">-</span>
    </div>
  </div>

  <div class="toast" id="toast">COPIED!</div>

<script>
  const lengthSliderTrack = document.getElementById('lengthSliderTrack');
  const lengthSliderFill = document.getElementById('lengthSliderFill');
  const lengthSliderThumb = document.getElementById('lengthSliderThumb');
  const lengthValue = document.getElementById('lengthValue');
  const numbersCheck = document.getElementById('numbersCheck');
  const specialCheck = document.getElementById('specialCheck');
  const upperCheck = document.getElementById('upperCheck');
  const generateBtn = document.getElementById('generateBtn');
  const copyBtn = document.getElementById('copyBtn');
  const passwordField = document.getElementById('password');
  const strengthLabel = document.getElementById('strengthLabel');
  const toast = document.getElementById('toast');
  const themeToggle = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');

  const SLIDER_MIN = 4;
  const SLIDER_MAX = 32;
  let sliderValue = 12;
  let isDragging = false;

  const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
  const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const digitChars = '0123456789';
  const specialChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

  function renderSlider(){
    const pct = ((sliderValue - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN)) * 100;
    lengthSliderFill.style.width = pct + '%';
    lengthSliderThumb.style.left = pct + '%';
    lengthSliderThumb.setAttribute('aria-valuenow', sliderValue);
    lengthValue.textContent = sliderValue;
  }

  function setSliderValueFromClientX(clientX){
    const rect = lengthSliderTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    const rawValue = SLIDER_MIN + pct * (SLIDER_MAX - SLIDER_MIN);
    const newValue = Math.round(rawValue);
    if (newValue !== sliderValue){
      sliderValue = newValue;
      renderSlider();
      generateBtn.click();
    }
  }

  function startDrag(clientX){
    isDragging = true;
    setSliderValueFromClientX(clientX);
  }

  lengthSliderThumb.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    lengthSliderThumb.setPointerCapture(e.pointerId);
    startDrag(e.clientX);
  });

  lengthSliderTrack.addEventListener('pointerdown', (e) => {
    if (e.target === lengthSliderThumb) return;
    startDrag(e.clientX);
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    setSliderValueFromClientX(e.clientX);
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  lengthSliderThumb.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){
      sliderValue = Math.min(SLIDER_MAX, sliderValue + 1);
      renderSlider();
      generateBtn.click();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){
      sliderValue = Math.max(SLIDER_MIN, sliderValue - 1);
      renderSlider();
      generateBtn.click();
    }
  });

  renderSlider();

  function generatePassword(){
    const length = sliderValue;
    const useNumbers = numbersCheck.checked;
    const useSpecial = specialCheck.checked;
    const useUpper = upperCheck.checked;

    let pool = lowerChars;
    if (useUpper) pool += upperChars;
    if (useNumbers) pool += digitChars;
    if (useSpecial) pool += specialChars;

    let password = '';
    let hasNumber = !useNumbers;
    let hasSpecial = !useSpecial;
    let hasUpper = !useUpper;

    while (password.length < length || !hasNumber || !hasSpecial || !hasUpper) {
      const char = pool[Math.floor(Math.random() * pool.length)];
      password += char;

      if (useNumbers && digitChars.includes(char)) hasNumber = true;
      if (useSpecial && specialChars.includes(char)) hasSpecial = true;
      if (useUpper && upperChars.includes(char)) hasUpper = true;

      if (password.length > length + 200) break;
    }

    password = shuffleString(password).slice(0, Math.max(length, password.length >= length ? length : password.length));

    return password;
  }

  function shuffleString(str){
    const arr = str.split('');
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.join('');
  }

  function rateStrength(password){
    const len = password.length;

    if (len <= 7) return { text:'WEAK', bg:'#ff3b3b' };
    if (len <= 10) return { text:'Acceptable', bg:'#ffe066' };
    if (len <= 14) return { text:'Strong', bg:'#a259ff' };
    return { text:'Boom!', bg:'#00c2ff' };
  }

  function generateAndDisplay(){
    const useNumbers = numbersCheck.checked;
    const useSpecial = specialCheck.checked;
    const useUpper = upperCheck.checked;

    if (!useNumbers && !useSpecial && !useUpper){
      passwordField.value = 'Select at least one option!';
      strengthLabel.textContent = '-';
      strengthLabel.style.background = 'transparent';
      return;
    }

    const pwd = generatePassword();
    passwordField.value = pwd;

    const result = rateStrength(pwd);
    strengthLabel.textContent = result.text;
    strengthLabel.style.background = result.bg;
  }

  generateBtn.addEventListener('click', generateAndDisplay);

  numbersCheck.addEventListener('change', generateAndDisplay);
  specialCheck.addEventListener('change', generateAndDisplay);
  upperCheck.addEventListener('change', generateAndDisplay);

  copyBtn.addEventListener('click', async () => {
    if (!passwordField.value || passwordField.value === 'Click GENERATE!') return;
    try {
      await navigator.clipboard.writeText(passwordField.value);
    } catch (e) {
      passwordField.select();
      document.execCommand('copy');
    }
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1200);
  });

  themeToggle.addEventListener('click', () => {
    const body = document.body;
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeLabel.textContent = isDark ? 'LIGHT' : 'DARK';
  });

  window.addEventListener('load', () => {
    generateBtn.click();
  });
</script>

</body>
</html>
